<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everything Search Engine</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #202124;
      --text-muted: #5f6368;
      --accent-color: #1a73e8;
      --border-color: #dfe1e5;
      --shadow: 0 1px 6px rgba(32,33,36,0.1);
      --badge-bg: #e8f0fe;
      --badge-text: #1967d2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      justify-content: center;
    }

    /* ---------- MAIN CONTAINER ---------- */
    .container {
      width: 100%;
      max-width: 900px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
    }

    /* ---------- HOME MODE (Google-like) ---------- */
    .container.home-mode {
      justify-content: center;
      align-items: center;
    }

    .home-mode .search-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 620px;
      gap: 32px;
    }

    .home-mode .logo-block {
      text-align: center;
    }

    .home-mode .logo {
      font-size: 5rem;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: -2px;
      line-height: 1;
    }

    .home-mode .search-box {
      width: 100%;
      margin-bottom: 0;
    }

    .home-mode .results-section {
      display: none;
    }

    /* ---------- RESULTS MODE ---------- */
    .container.results-mode {
      justify-content: flex-start;
    }

    .results-mode .search-section {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .results-mode .logo-block {
      flex-shrink: 0;
    }

    .results-mode .logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: -0.5px;
      cursor: pointer;
      line-height: 1;
    }

    .results-mode .logo:hover {
      text-decoration: underline;
    }

    .results-mode .search-box {
      flex: 1;
      margin-bottom: 0;
      min-width: 0;
    }

    .results-mode .results-section {
      display: block;
    }

    /* ---------- SHARED SEARCH BOX ---------- */
    .search-box {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 8px 8px 8px 16px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s ease;
    }

    .search-box:focus-within {
      box-shadow: 0 2px 8px rgba(32,33,36,0.2);
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.05rem;
      color: var(--text-main);
      background: transparent;
      min-width: 0;
      padding: 4px 8px;
    }

    .search-btn {
      background: transparent;
      border: none;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    .search-btn:hover {
      background: rgba(60, 64, 67, 0.08);
    }

    .search-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--text-muted);
    }

    /* ---------- THREE-DOT MENU ---------- */
    .menu-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      z-index: 100;
    }

    .menu-btn:hover {
      background: rgba(60, 64, 67, 0.08);
    }

    .menu-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--text-muted);
    }

    .menu-dropdown {
      position: fixed;
      top: 64px;
      right: 18px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(32,33,36,0.18);
      min-width: 180px;
      padding: 6px 0;
      z-index: 100;
      display: none;
    }

    .menu-dropdown.open {
      display: block;
    }

    .menu-dropdown a {
      display: block;
      padding: 10px 18px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .menu-dropdown a:hover {
      background: #f1f3f4;
    }

    /* ---------- RESULTS ---------- */
    .results-info {
      margin-bottom: 15px;
      font-size: 0.88rem;
      color: var(--text-muted);
      min-height: 20px;
    }

    .result-card {
      background: var(--card-bg);
      padding: 18px 20px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .result-url {
      font-size: 0.85rem;
      color: #006621;
      word-break: break-all;
    }

    .result-title {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .result-title a {
      color: #1a0dab;
      text-decoration: none;
    }

    .result-title a:hover {
      text-decoration: underline;
    }

    .result-desc {
      font-size: 0.95rem;
      color: #4d5156;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .keywords-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: #f1f3f4;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* ---------- LOADING MODAL ---------- */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .overlay.hidden {
      display: none;
    }

    .modal {
      background: white;
      width: 90%;
      max-width: 550px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .modal h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .modal p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .progress-container {
      width: 100%;
      height: 16px;
      background-color: #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--accent-color);
      transition: width 0.3s ease;
    }

    .log-box {
      background: #1e1e1e;
      color: #00ff66;
      font-family: monospace;
      font-size: 0.8rem;
      height: 140px;
      padding: 10px;
      border-radius: 6px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- Three-dot menu (top right) -->
  <button class="menu-btn" id="menuBtn" aria-label="Menu">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="2"/>
      <circle cx="12" cy="12" r="2"/>
      <circle cx="12" cy="19" r="2"/>
    </svg>
  </button>
  <div class="menu-dropdown" id="menuDropdown">
    <a href="https://landen-martin.github.io/LTE/" target="_blank" rel="noopener">Everything Docs</a>
  </div>

  <div class="container home-mode" id="app">
    <div class="search-section">
      <div class="logo-block" id="logoBlock">
        <h1 class="logo" id="logoText">Everything</h1>
      </div>
      <div class="search-box">
        <button class="search-btn" id="searchBtn" aria-label="Search">
          <svg viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 0 0 1.57-4.23 6.5 6.5 0 1 0-6.5 6.5c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
        <input type="text" id="searchInput" placeholder="Search topics, keywords, websites..." autofocus>
      </div>
    </div>

    <div class="results-section" id="resultsSection">
      <div id="resultsInfo" class="results-info"></div>
      <div id="resultsContainer"></div>
    </div>
  </div>

  <!-- Dynamic Loading Modal -->
  <div id="loadingOverlay" class="overlay hidden">
    <div class="modal">
      <h2>Building Web Index</h2>
      <p id="scrapeStatusText">Checking index status...</p>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="logConsole" class="log-box"></div>
    </div>
  </div>

  <script>
    const TARGET_URLS = [
      "https://wikipedia.org", "https://developer.mozilla.org", "https://github.com",
      "https://stackoverflow.com", "https://nasa.gov", "https://bbc.com",
      "https://archive.org", "https://w3schools.com", "https://arxiv.org", "https://python.org"
    ];

    let siteIndex = [];
    let processedIndex = [];
    let idfMap = {};
    let avgWeightedLength = 1;
    let maxRankScore = 1;

    const app = document.getElementById("app");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const logoBlock = document.getElementById("logoBlock");
    const resultsContainer = document.getElementById("resultsContainer");
    const resultsInfo = document.getElementById("resultsInfo");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const progressBar = document.getElementById("progressBar");
    const scrapeStatusText = document.getElementById("scrapeStatusText");
    const logConsole = document.getElementById("logConsole");
    const menuBtn = document.getElementById("menuBtn");
    const menuDropdown = document.getElementById("menuDropdown");

    // ---------- STOP WORDS ----------
    const STOP_WORDS = new Set([
      "a", "about", "above", "after", "again", "against", "all", "am", "an", "and", "any", "are", "aren't",
      "as", "at", "be", "because", "been", "before", "being", "below", "between", "both", "but", "by",
      "can't", "cannot", "could", "couldn't", "did", "didn't", "do", "does", "doesn't", "doing", "don't",
      "down", "during", "each", "few", "for", "from", "further", "had", "hadn't", "has", "hasn't", "have",
      "haven't", "having", "he", "he'd", "he'll", "he's", "her", "here", "here's", "hers", "herself", "him",
      "himself", "his", "how", "how's", "i", "i'd", "i'll", "i'm", "i've", "if", "in", "into", "is", "isn't",
      "it", "it's", "its", "itself", "let's", "me", "more", "most", "mustn't", "my", "myself", "no", "nor",
      "not", "of", "off", "on", "once", "only", "or", "other", "ought", "our", "ours", "ourselves", "out",
      "over", "own", "same", "shan't", "she", "she'd", "she'll", "she's", "should", "shouldn't", "so", "some",
      "such", "than", "that", "that's", "the", "their", "theirs", "them", "themselves", "then", "there",
      "there's", "these", "they", "they'd", "they'll", "they're", "they've", "this", "those", "through",
      "to", "too", "under", "until", "up", "very", "was", "wasn't", "we", "we'd", "we'll", "we're", "we've",
      "were", "weren't", "what", "what's", "when", "when's", "where", "where's", "which", "while", "who",
      "who's", "whom", "why", "why's", "with", "won't", "would", "wouldn't", "you", "you'd", "you'll",
      "you're", "you've", "your", "yours", "yourself", "yourselves"
    ]);

    // ---------- SIMPLE STEMMER ----------
    function stem(word) {
      if (word.length <= 3) return word;
      if (word.endsWith('ing')) return word.slice(0, -3);
      if (word.endsWith('ed')) return word.slice(0, -2);
      if (word.endsWith('ly')) return word.slice(0, -2);
      if (word.endsWith('es')) return word.slice(0, -2);
      if (word.endsWith('s')) return word.slice(0, -1);
      return word;
    }

    // ---------- TOKENIZER ----------
    function tokenize(text) {
      if (!text) return [];
      return text.toLowerCase()
        .replace(/[^a-z0-9\s]/g, ' ')
        .split(/\s+/)
        .filter(t => t.length > 0 && !STOP_WORDS.has(t))
        .map(stem);
    }

    // ---------- PREPROCESS INDEX ----------
    function preprocessIndex() {
      const fieldNames = ['title', 'description', 'keywords', 'url'];
      const fieldWeights = { title: 5.0, keywords: 3.0, description: 1.5, url: 1.0 };

      processedIndex = [];
      idfMap = {};
      maxRankScore = 1;

      const docs = siteIndex.map(site => {
        const processed = {
          original: site,
          fields: {},
          authorityRaw: 0,
          authority: 0,
          weightedLength: 0
        };

        fieldNames.forEach(field => {
          let text = '';
          if (field === 'keywords') {
            text = (site.keywords || []).join(' ');
          } else {
            text = site[field] || '';
          }
          const tokens = tokenize(text);
          const tf = {};
          tokens.forEach(t => { tf[t] = (tf[t] || 0) + 1; });
          processed.fields[field] = {
            tokens: tokens,
            tf: tf,
            length: tokens.length
          };
        });

        let rank = site.rank_score;
        if (rank === undefined || rank === null) {
          rank = 1.0 + Math.log1p(site.inbound_count || 0);
        }
        processed.authorityRaw = rank;
        if (rank > maxRankScore) maxRankScore = rank;

        return processed;
      });

      const N = docs.length;

      const df = {};
      const allTerms = new Set();
      docs.forEach(doc => {
        const termsInDoc = new Set();
        fieldNames.forEach(field => {
          Object.keys(doc.fields[field].tf).forEach(t => termsInDoc.add(t));
        });
        termsInDoc.forEach(t => {
          df[t] = (df[t] || 0) + 1;
          allTerms.add(t);
        });
      });

      allTerms.forEach(term => {
        const dfreq = df[term] || 0;
        idfMap[term] = Math.log((N - dfreq + 0.5) / (dfreq + 0.5) + 1);
      });

      let totalWeightedLength = 0;
      docs.forEach(doc => {
        let wLen = 0;
        fieldNames.forEach(field => {
          wLen += fieldWeights[field] * doc.fields[field].length;
        });
        doc.weightedLength = wLen;
        totalWeightedLength += wLen;
      });
      avgWeightedLength = totalWeightedLength / N || 1;

      docs.forEach(doc => {
        doc.authority = doc.authorityRaw / maxRankScore;
      });

      processedIndex = docs;
      siteIndex.forEach((site, idx) => {
        site._processed = docs[idx];
      });
    }

    // ---------- BM25F SCORING ----------
    function computeBM25F(queryTerms, doc) {
      const fieldNames = ['title', 'description', 'keywords', 'url'];
      const fieldWeights = { title: 5.0, keywords: 3.0, description: 1.5, url: 1.0 };
      const k1 = 1.2;
      const b = 0.75;

      let score = 0;
      queryTerms.forEach(term => {
        const idf = idfMap[term] || 0;
        if (idf === 0) return;

        let tf = 0;
        fieldNames.forEach(field => {
          const fieldTf = doc.fields[field].tf[term] || 0;
          tf += fieldWeights[field] * fieldTf;
        });

        if (tf === 0) return;

        const docLen = doc.weightedLength;
        const avgDocLen = avgWeightedLength;
        const norm = k1 * (1 - b + b * (docLen / avgDocLen));
        score += idf * (tf / (norm + tf));
      });
      return score;
    }

    // ---------- URL ROUTING ----------
    function getQueryFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('q') || '';
    }

    function setQueryInURL(query, replace = false) {
      const base = window.location.pathname;
      const url = query ? `${base}?q=${encodeURIComponent(query)}` : base;
      if (replace) {
        history.replaceState({ query }, '', url);
      } else {
        history.pushState({ query }, '', url);
      }
    }

    function updateView(query) {
      const hasQuery = query && query.trim().length > 0;
      if (hasQuery) {
        app.classList.remove('home-mode');
        app.classList.add('results-mode');
        document.title = `${query.trim()} - Everything`;
      } else {
        app.classList.add('home-mode');
        app.classList.remove('results-mode');
        resultsContainer.innerHTML = '';
        resultsInfo.innerText = '';
        document.title = 'Everything Search Engine';
      }
    }

    // ---------- INIT ----------
    async function init() {
      let loaded = false;

      try {
        const response = await fetch("websites.json");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        siteIndex = await response.json();
        preprocessIndex();
        loaded = true;
      } catch (e) {
        logMessage(`[!] Could not load websites.json directly (${e.message})`);
      }

      if (!loaded) {
        const cached = localStorage.getItem("everything_websites_json");
        if (cached) {
          try {
            siteIndex = JSON.parse(cached);
            preprocessIndex();
            loaded = true;
          } catch(e) {}
        }
      }

      if (!loaded) {
        await runScraper();
        return;
      }

      handleInitialRoute();
    }

    function handleInitialRoute() {
      const initialQuery = getQueryFromURL();
      if (initialQuery) {
        searchInput.value = initialQuery;
        performSearch(initialQuery, false);
      } else {
        updateView('');
      }
    }

    function logMessage(msg) {
      logConsole.innerText += msg + "\n";
      logConsole.scrollTop = logConsole.scrollHeight;
    }

    // ---------- CLIENT-SIDE SCRAPER FALLBACK ----------
    async function runScraper() {
      loadingOverlay.classList.remove("hidden");
      logConsole.innerText = "=== Everything Search Engine Indexer ===\n";
      siteIndex = [];
      progressBar.style.width = "0%";

      for (let i = 0; i < TARGET_URLS.length; i++) {
        const url = TARGET_URLS[i];
        const percent = Math.round(((i + 1) / TARGET_URLS.length) * 100);

        scrapeStatusText.innerText = `Scraping [${i + 1}/${TARGET_URLS.length}]: ${url}`;
        logMessage(`[*] Fetching: ${url}...`);

        try {
          const siteData = await scrapeUrl(url);
          siteIndex.push(siteData);
        } catch (err) {
          logMessage(`    [-] Failed ${url}: ${err.message}`);
        }

        progressBar.style.width = `${percent}%`;
        await new Promise(r => setTimeout(r, 80));
      }

      if (siteIndex.length > 0) {
        localStorage.setItem("everything_websites_json", JSON.stringify(siteIndex, null, 2));
      }

      preprocessIndex();

      setTimeout(() => {
        loadingOverlay.classList.add("hidden");
        handleInitialRoute();
      }, 400);
    }

    async function scrapeUrl(url) {
      const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(3500) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const html = await res.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      let title = doc.querySelector("title")?.textContent.trim() || url;
      let description = doc.querySelector('meta[name="description" i]')?.getAttribute("content") || "";

      if (!description && doc.body) {
        description = doc.body.innerText.replace(/\s+/g, " ").trim().slice(0, 180) + "...";
      }

      const allText = `${title} ${description}`.toLowerCase();
      const keywords = Array.from(new Set(allText.match(/\b[a-zA-Z]{3,}\b/g) || [])).slice(0, 12);

      logMessage(`    [+] Indexed: ${title.slice(0, 35)}...`);
      return { url, title, description, keywords, inbound_count: 1, rank_score: 1.0 };
    }

    // ---------- SEARCH ----------
    function performSearch(query, updateURL = true) {
      query = (query || '').trim();

      if (updateURL) setQueryInURL(query);
      updateView(query);

      if (!query) return;

      const startTime = performance.now();
      const lowerQuery = query.toLowerCase();
      const queryTerms = tokenize(lowerQuery);

      resultsContainer.innerHTML = "";

      if (queryTerms.length === 0) {
        renderResults([]);
        resultsInfo.innerText = `No results found for "${query}"`;
        return;
      }

      const scored = siteIndex.map(site => {
        const doc = site._processed;
        if (!doc) return { site, rawScore: 0 };

        let rawScore = computeBM25F(queryTerms, doc);

        const titleLower = (site.title || '').toLowerCase();
        const descLower = (site.description || '').toLowerCase();
        const keywordsLower = (site.keywords || []).map(k => k.toLowerCase());

        if (titleLower === lowerQuery) rawScore += 10;
        if (keywordsLower.includes(lowerQuery)) rawScore += 8;
        if (queryTerms.length > 1) {
          if (titleLower.includes(lowerQuery)) rawScore += 5;
          if (keywordsLower.some(k => k.includes(lowerQuery))) rawScore += 3;
          if (descLower.includes(lowerQuery)) rawScore += 1;
        }

        let presentTerms = 0;
        queryTerms.forEach(term => {
          let found = false;
          for (let f of ['title', 'description', 'keywords', 'url']) {
            if (doc.fields[f].tf[term] > 0) { found = true; break; }
          }
          if (found) presentTerms++;
        });
        const coverage = presentTerms / queryTerms.length;
        if (coverage === 1) rawScore += 2;
        else if (coverage < 0.5) rawScore -= 2;

        return { site, rawScore };
      });

      const maxRaw = Math.max(...scored.map(s => s.rawScore), 0);
      scored.forEach(s => {
        s.relevanceNorm = maxRaw > 0 ? s.rawScore / maxRaw : 0;
      });

      scored.forEach(s => {
        const auth = s.site._processed ? s.site._processed.authority : 0.5;
        s.finalScore = 0.75 * s.relevanceNorm + 0.25 * auth;
      });

      scored.sort((a, b) => b.finalScore - a.finalScore);

      const searchTime = ((performance.now() - startTime) / 1000).toFixed(2);
      const results = scored.filter(s => s.relevanceNorm > 0).map(s => s.site);

      if (results.length === 0) {
        resultsInfo.innerText = `No results found for "${query}" in ${searchTime} seconds`;
        renderResults([]);
        return;
      }

      resultsInfo.innerText = `Found ${results.length} result(s) for "${query}" in ${searchTime} seconds`;
      renderResults(results);
    }

    // ---------- RENDER RESULTS ----------
    function renderResults(list) {
      resultsContainer.innerHTML = "";

      if (list.length === 0) {
        resultsContainer.innerHTML = `
          <div class="result-card">
            <div class="result-title">No results found</div>
            <div class="result-desc">No matching results found in the index graph.</div>
          </div>
        `;
        return;
      }

      list.forEach(site => {
        const card = document.createElement("div");
        card.className = "result-card";

        const tags = (site.keywords || []).map(k => `<span class="tag">${k}</span>`).join(" ");

        card.innerHTML = `
          <div class="result-header">
            <div class="result-url">${site.url}</div>
          </div>
          <div class="result-title"><a href="${site.url}" target="_blank" rel="noopener">${site.title}</a></div>
          <div class="result-desc">${site.description}</div>
          <div class="keywords-tags">${tags}</div>
        `;

        resultsContainer.appendChild(card);
      });
    }

    // ---------- MENU ----------
    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      menuDropdown.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (!menuDropdown.contains(e.target) && e.target !== menuBtn) {
        menuDropdown.classList.remove("open");
      }
    });

    // ---------- EVENT LISTENERS ----------
    searchBtn.addEventListener("click", () => performSearch(searchInput.value));
    searchInput.addEventListener("keyup", (e) => {
      if (e.key === "Enter") performSearch(searchInput.value);
    });

    logoBlock.addEventListener("click", () => {
      if (app.classList.contains("results-mode")) {
        searchInput.value = "";
        setQueryInURL("");
        updateView("");
        searchInput.focus();
      }
    });

    window.addEventListener("popstate", () => {
      const q = getQueryFromURL();
      searchInput.value = q;
      performSearch(q, false);
    });

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
